name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "desktop.png"
      - "feishu_*.png"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Check & Test (${{ matrix.platform }} - ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64)
          - platform: "macos-latest"
            arch: "arm64"
            rust_target: ""

          # Linux amd64 (x86_64)
          - platform: "ubuntu-22.04"
            arch: "amd64"
            rust_target: ""

          # Linux arm64 (aarch64) - Native ARM64 Runner
          - platform: "ubuntu-24.04-arm"
            arch: "arm64"
            rust_target: ""

          # Windows amd64 (x86_64)
          - platform: "windows-latest"
            arch: "x86_64"
            rust_target: ""

          # Windows arm64 (aarch64 cross-check)
          - platform: "windows-latest"
            arch: "arm64"
            rust_target: "aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Target (${{ matrix.rust_target }})
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies (Linux only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - name: Install Node dependencies
        run: pnpm install

      - name: Frontend typecheck & build
        run: pnpm build

      - name: Rust backend check & test (Native)
        if: matrix.rust_target == ''
        working-directory: ./src-tauri
        run: |
          cargo check --all-targets
          cargo test

      - name: Rust backend check (Cross-compilation)
        if: matrix.rust_target != ''
        working-directory: ./src-tauri
        run: cargo check --target ${{ matrix.rust_target }}
