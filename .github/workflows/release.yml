name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      draft:
        description: "Create draft release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.platform }} - ${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Universal (Dual Arch: arm64 + x86_64 in single bundle)
          - platform: "macos-latest"
            arch: "universal"
            args: "--target universal-apple-darwin"
            rust_target: "universal"

          # macOS Apple Silicon (arm64)
          - platform: "macos-latest"
            arch: "arm64"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"

          # macOS Intel (x86_64 / amd64)
          - platform: "macos-latest"
            arch: "x86_64"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"

          # Linux amd64 (x86_64)
          - platform: "ubuntu-22.04"
            arch: "amd64"
            args: ""
            rust_target: ""

          # Linux arm64 (aarch64) - Native ARM64 Runner
          - platform: "ubuntu-24.04-arm"
            arch: "arm64"
            args: ""
            rust_target: ""

          # Windows amd64 (x86_64)
          - platform: "windows-latest"
            arch: "x86_64"
            args: ""
            rust_target: ""

          # Windows arm64 (aarch64)
          - platform: "windows-latest"
            arch: "arm64"
            args: "--target aarch64-pc-windows-msvc --bundles nsis"
            rust_target: "aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal targets
        if: matrix.rust_target == 'universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Add Specific Rust Target (${{ matrix.rust_target }})
        if: matrix.rust_target != '' && matrix.rust_target != 'universal'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies (Linux only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - name: Install Node dependencies
        run: pnpm install

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "AI Agent Launcher ${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: "AI Agent Launcher 跨平台版本（支持 macOS · Windows · Linux 的 arm64 与 amd64 完整多架构安装包）。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ !(github.event.inputs.draft == true || github.event.inputs.draft == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Release to Public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "==> Publishing Release $TAG..."
          gh release edit "$TAG" --draft=false --latest
          echo "==> Release published successfully!"
