<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent Launcher</title>
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="alternate icon" href="/favicon.png" />
    <script>
      (function() {
        try {
          var setting = localStorage.getItem("launcher_theme_setting") || "auto";
          var isDark = setting === "dark" || (setting === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cds-surface-0, #f5f5f3);
      }
      input, textarea, select {
        user-select: text;
        -webkit-user-select: text;
      }
      .log-body, .log-line, .log-body * {
        user-select: text !important;
        -webkit-user-select: text !important;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
